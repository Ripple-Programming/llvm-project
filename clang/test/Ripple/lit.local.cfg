# -*- Python -*-

# The build system is responsible for ensuring the Ripple runtime is available.
# The CI workflow, via the "Build and Link Ripple Runtime" step, creates a
# symlink to the correct location. Therefore, we can assume the feature is
# present when the tests are run against the Hexagon target.
if 'hexagon' in config.target_triple:
    config.available_features.add('has-ripple-hexagon-rtlib')
